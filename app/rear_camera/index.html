<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:transparent;font:15px system-ui,sans-serif}
  .box{position:relative;height:100%;background:#111;border-radius:6px;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shutter{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;
    border:4px solid #fff;background:rgba(255,255,255,.18);cursor:pointer;padding:0}
  .shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
  .shutter:active::after{inset:9px}.shutter:disabled{opacity:.35}
  .flip{position:absolute;right:14px;bottom:30px;border:0;border-radius:20px;padding:8px 12px;background:rgba(0,0,0,.55);
    color:#fff;font:13px system-ui,sans-serif;cursor:pointer}
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    padding:0 24px;text-align:center;color:#fff;background:#1c1917}
  .msg small{color:#cfc8bf}
</style></head>
<body>
<div class="box">
  <video id="v" autoplay playsinline muted></video>
  <button id="shot" class="shutter" aria-label="Take photo" disabled></button>
  <button id="flip" class="flip" type="button">Flip camera</button>
  <div id="msg" class="msg" hidden></div>
</div>
<script>
// Minimal Streamlit component protocol (no build step): ready -> render args -> setComponentValue.
const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
const $ = (id) => document.getElementById(id);
let facing = "environment", stream = null, started = false;

async function start() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  $("msg").hidden = true; $("shot").disabled = true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("Camera access needs HTTPS.");
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 } }, audio: false });
    $("v").srcObject = stream; await $("v").play(); $("shot").disabled = false;
  } catch (e) {
    $("msg").hidden = false;
    $("msg").innerHTML = "Camera unavailable<small>" + (e.message || "Permission denied") + ". Allow camera access for this site, or upload a photo instead.</small>";
  }
}
$("flip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; start(); };
$("shot").onclick = () => {
  const v = $("v"), k = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  stream.getTracks().forEach((t) => t.stop());
  send("streamlit:setComponentValue", { value: c.toDataURL("image/jpeg", 0.9), dataType: "json" });
};
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render" && !started) {
    started = true;
    const a = e.data.args || {}; facing = a.facing || "environment"; start();
  }
});
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: window.__h || 520 });
</script>
</body></html>
