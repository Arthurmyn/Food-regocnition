<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Dog or Not · Food Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lens.css">
</head>
<body>
  <div id="header"></div>
  <main class="wrap center">
    <h1 class="page-title" style="margin-top:34px;font-size:34px">Is it a hot dog?</h1>
    <p class="page-sub" style="margin-bottom:22px">A deeply unnecessary computer vision experiment.</p>

    <div class="phone"><div class="screen" id="screen">
      <video id="cam" autoplay playsinline muted></video>
      <img id="photo" class="photo" alt="Your photo" hidden>
      <div id="overlay"></div>
      <div id="msg" class="msg" hidden></div>
      <button id="shutter" class="shutter" aria-label="Take photo" disabled></button>
    </div></div>
    <p id="verdict" class="verdict" hidden></p>

    <div class="stack" id="camControls">
      <label class="btn block">Upload a photo instead<input id="file" type="file" accept="image/*" hidden></label>
    </div>
    <div class="stack" id="resControls" hidden>
      <button id="again" class="btn primary block">Take another photo</button>
      <button id="infoBtn" class="btn block">Additional information</button>
    </div>

    <section id="info" class="card" style="margin-top:28px;text-align:left" hidden></section>
    <p class="small" style="margin:18px auto 0;max-width:460px">This model knows only five food classes, so it can be
      confidently wrong about almost everything else. Inspired by the "Not Hotdog" gag from the TV show Silicon Valley.
      Photos are analysed on the server and not stored.</p>
  </main>
  <script type="module" src="/js/hotdog.js"></script>
</body>
</html>
